[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers --html=artifacts/report.html --self-contained-html
# An xfail that unexpectedly passes fails the run, so a fixed bug forces the test to be updated.
xfail_strict = true
markers =
    api: calls the HTTP API directly with requests (no browser)
    ui: drives desktop Chrome with Selenium
