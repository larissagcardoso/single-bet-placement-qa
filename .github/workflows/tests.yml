name: tests

# API tests run on every push and pull request: fast and browser-free.
# The full suite, including the UI journey, runs on demand from the Actions tab,
# because the E2E test currently fails on known product bugs (see docs/execution-results.md).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: Tests to run
        type: choice
        options: [all, api]
        default: all

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      USER_ID: ${{ secrets.USER_ID }}
      HEADLESS: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.suite }}" = "all" ]; then
            pytest
          else
            pytest -m api
          fi

      - name: Upload HTML report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: artifacts/
